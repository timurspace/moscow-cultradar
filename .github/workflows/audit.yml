name: Культрадар — аудит данных

on:
  workflow_dispatch:
  push:
    paths:
      - "data/events/**"
      - "scripts/build-events.js"
      - "events.json"
      - "events-index.json"
      - "sources.json"
      - "validate.js"
      - "app.js"

jobs:
  audit:
    name: Проверка афиши
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check validate.js
          node --check scripts/build-events.js

      - name: Rebuild generated event artifacts
        run: node scripts/build-events.js

      - name: Check generated artifacts are current
        run: git diff --exit-code -- events.json events-index.json

      - name: Run audit
        run: node validate.js --md

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: cultradar-audit-report
          path: audit-report.md
